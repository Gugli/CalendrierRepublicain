<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calendrier Républicain</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
CALENDRIER RÉPUBLICAIN FRANÇAIS
</header>

<h2 id="monthTitle"></h2>

<div class="nav">
	<button id="monthPrev" onclick="changeMonth(-1)"></button>
	<button id="today" onclick="goToday()"></button>
	<button id="monthNext" onclick="changeMonth(1)"></button>
</div>

<div class="calendar" id="calendar"></div>

<div class="footer-note" id="footer"></div>

<script src="calendar.js"></script>

</body>
</html>
